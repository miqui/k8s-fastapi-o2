# ArgoCD Application syncing k8s/ (Postgres, Hazelcast, message-service, issue-service, Ingress,
# ResourceQuota - everything k8s/kustomization.yaml produces) - replaces the manual
# `kubectl apply -k k8s/` step in deploy-kind.sh. Which image tags message-service/issue-service
# run is decided by Argo CD Image Updater, configured in image-updater.yaml alongside this file.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: graphql-apollo-prisma-o2
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/miqui/k8s-graphql-apollo-prisma-o2.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
  # postgres-credentials is a committed placeholder in k8s/secret.yaml that deploy-kind.sh
  # immediately overwrites in-cluster with real 1Password-sourced values. Without this,
  # selfHeal would revert that Secret back to the placeholder on every reconcile and break
  # Postgres auth - see the README's ArgoCD section for the full explanation.
  ignoreDifferences:
    - group: ""
      kind: Secret
      name: postgres-credentials
      jsonPointers:
        - /data
        - /stringData
