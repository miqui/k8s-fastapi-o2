# Local kind-cluster development credentials only - do not reuse these values
# outside a disposable local cluster, and manage real secrets via a proper
# secrets manager (e.g. Sealed Secrets, External Secrets, Vault) instead.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  labels:
    app: postgres
type: Opaque
stringData:
  # Consumed by the message-service app container
  DB_USER: "message_app"
  DB_PASSWORD: "message_app"
  # Consumed by the official postgres image, which requires these exact names
  POSTGRES_USER: "message_app"
  POSTGRES_PASSWORD: "message_app"
