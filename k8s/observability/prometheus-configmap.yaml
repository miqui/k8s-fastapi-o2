apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: observability
  labels:
    app: prometheus
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s

    scrape_configs:
      - job_name: 'otel-collector'
        static_configs:
          - targets: ['otel-collector.observability.svc.cluster.local:8889']

      - job_name: 'kube-state-metrics'
        static_configs:
          - targets: ['kube-state-metrics.observability.svc.cluster.local:8080']

      # postgres runs in the default namespace (see k8s/postgres-statefulset.yaml), not
      # observability; postgres-exporter is a sidecar in that same pod, reached via the postgres
      # headless Service's "metrics" port.
      - job_name: 'postgres-exporter'
        static_configs:
          - targets: ['postgres.default.svc.cluster.local:9187']

      # node-exporter runs hostNetwork, so its pod IP == the node's IP; scraped directly
      - job_name: 'node-exporter'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: ['observability']
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            regex: node-exporter
            action: keep
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: node
          - source_labels: [__address__]
            regex: '(.+):\d+'
            target_label: __address__
            replacement: '${1}:9100'

      # Per-container resource usage (CPU/memory), scraped via the API server's proxy to each
      # kubelet's cAdvisor endpoint - avoids needing direct network access to kubelet's port 10250.
      - job_name: 'kubernetes-nodes-cadvisor'
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            target_label: __metrics_path__
            replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor
