# The same rules, report-only, for namespaces whose workloads this repo doesn't harden yet:
# `observability` (hand-written manifests without securityContexts) and `headlamp` (third-party
# chart). Violations show up in PolicyReports; nothing is blocked.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../rules
nameSuffix: -audit
patches:
  - target:
      group: policies.kyverno.io
      kind: ValidatingPolicy
    patch: |-
      - op: add
        path: /spec/matchConstraints/namespaceSelector
        value:
          matchExpressions:
            - key: kubernetes.io/metadata.name
              operator: In
              values: ["observability", "headlamp"]
