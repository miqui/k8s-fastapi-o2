# Values for the `kyverno/kyverno` chart (https://kyverno.io - policy engine; the policies
# themselves live in k8s/policies/ and are applied by their own Argo CD Application). Installed by
# deploy-kind.sh with:
#   helm upgrade --install kyverno kyverno/kyverno \
#     --version 3.9.1 --namespace kyverno --create-namespace \
#     -f k8s/kyverno/kyverno-values.yaml
# Chart 3.9.1 = Kyverno v1.19.1, whose tested Kubernetes range is 1.33-1.35; this kind cluster
# runs newer, which is accepted (untested, not known-broken).
#
# Left at chart defaults on purpose: one replica per controller (the chart's HA guidance is 2-3,
# which is overkill for a disposable local cluster) and its default resource requests (about
# 400m CPU / 320Mi memory across the four controllers).

# Every chart workload, hook jobs included, goes on the same node group as Headlamp - this repo
# pins each workload to a `workload` node group (see k8s/kind-config.yaml).
global:
  nodeSelector:
    workload: observability

features:
  # Required for the PolicyExceptions in k8s/policies/exceptions/ to take effect at all, and
  # only honoured from the namespace named here (cluster admins, not app namespaces).
  policyExceptions:
    enabled: true
    namespace: kyverno

config:
  # Safety net independent of any policy's own scope: the admission webhook never sees these
  # namespaces, so an unhealthy Kyverno can't block system, GitOps or ingress changes. (The
  # kyverno namespace itself is excluded by the chart's excludeKyvernoNamespace default.) This
  # replaces the chart's default list, so kube-system is restated. Policies only match
  # `default`, `observability` and `headlamp` anyway; this limits the blast radius if that
  # ever widens or a policy is mis-scoped.
  webhooks:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            - kube-system
            - argocd
            - ingress-nginx
            - local-path-storage
