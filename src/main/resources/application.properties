spring.application.name=message-service

# Enable RFC 7807 / RFC 9457 Problem Details
spring.mvc.problemdetails.enabled=true

# Actuator configuration for Kubernetes Probes
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

# Server configuration
server.port=8080
server.shutdown=graceful

# PostgreSQL datasource
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:messagedb}
spring.datasource.username=${DB_USER:message_app}
spring.datasource.password=${DB_PASSWORD:message_app}
spring.datasource.driver-class-name=org.postgresql.Driver

# Apply schema.sql (idempotent DDL) against the datasource on every startup
spring.sql.init.mode=always

# MyBatis mapper locations / configuration are wired explicitly in
# com.example.messageservice.config.MyBatisConfig (see its Javadoc for why).

# OpenTelemetry metrics: push Micrometer metrics as OTLP to a collector
management.otlp.metrics.export.url=${OTEL_METRICS_URL:http://localhost:4318/v1/metrics}
management.otlp.metrics.export.step=15s

# Without this, the exported "_bucket" series only ever has a single +Inf bucket (i.e. no real
# histogram at all - PromQL histogram_quantile() always returns NaN against it), since Micrometer
# doesn't record percentile-histogram buckets for a Timer/DistributionSummary unless told to.
# Needed for the "API RED & Saturation" Grafana dashboard's latency percentile panels.
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles-histogram.hikaricp.connections.acquire=true

# Distinguishes each pod's metrics once they reach Prometheus (POD_NAME is set via the
# Downward API in k8s/deployment.yaml); without this, multiple replicas' JVM metrics are
# indistinguishable once exported through the OTel Collector's Prometheus exporter.
management.opentelemetry.resource-attributes.k8s.pod.name=${POD_NAME:local}
